services:
  api:
    build: ./back/api
    container_name: meridian-api
    restart: unless-stopped
    volumes:
      - ./data:/data

  front:
    build: ./front
    container_name: meridian-front
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    container_name: meridian-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - front

volumes:
  caddy_data:
  caddy_config: